<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jukebox</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Auth Modal -->
    <div id="auth-overlay" class="overlay">
        <div class="auth-card">
            <div class="auth-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            </div>
            <h2>Jukebox</h2>
            <p>Ingresa tu nombre para conectar</p>
            <form id="auth-form">
                <input type="text" id="username-input" placeholder="Tu nombre" required autocomplete="off" autofocus>
                <button type="submit" class="btn-primary">Conectar</button>
            </form>
        </div>
    </div>

    <!-- Main App -->
    <div class="app">
        <!-- Navigation Bar -->
        <nav class="navbar">
            <div class="nav-brand">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                <span class="nav-title">Jukebox</span>
            </div>
            <div class="nav-center">
                <select id="zone-selector" class="zone-select">
                    <option value="default">Cargando...</option>
                </select>
            </div>
            <div class="nav-right">
                <div class="user-badge" id="current-user-badge">Invitado</div>
                <div class="connection-dot" id="status-led"></div>
            </div>
        </nav>

        <!-- Content -->
        <main class="content">
            <!-- Now Playing Section -->
            <section class="now-playing" id="now-playing-section">
                <div class="np-artwork-wrapper">
                    <div class="np-artwork" id="np-artwork">
                        <img id="track-thumbnail" src="" alt="" class="np-img">
                        <div class="np-placeholder" id="np-placeholder">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                        </div>
                    </div>
                    <div class="np-eq" id="np-eq">
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                </div>
                <div class="np-info">
                    <div class="np-label">Ahora Reproduciendo</div>
                    <h1 class="np-title" id="track-title">Sin reproducción</h1>
                    <p class="np-subtitle" id="track-user">Agrega una canción para comenzar</p>
                </div>
                <div class="np-progress">
                    <span class="np-time" id="current-time">0:00</span>
                    <div class="np-progress-bar">
                        <div class="np-progress-fill" id="progress-bar"></div>
                    </div>
                    <span class="np-time" id="total-time">0:00</span>
                </div>
                <div class="np-controls">
                    <button class="ctrl-btn" id="btn-pause" title="Pausar">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
                    </button>
                    <button class="ctrl-btn ctrl-btn-primary" id="btn-resume" title="Reanudar">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    </button>
                    <button class="ctrl-btn" id="btn-skip" title="Saltar">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><rect x="15" y="4" width="3" height="16" rx="1"/></svg>
                    </button>
                    <div class="np-volume">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                        <input type="range" id="volume-slider" min="0" max="100" value="15" class="volume-slider">
                        <span class="volume-val" id="volume-value">15</span>
                    </div>
                </div>
            </section>

            <!-- Add Track Section -->
            <section class="add-section">
                <form id="add-track-form" class="add-form">
                    <div class="add-input-wrapper">
                        <svg class="add-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="url" id="track-url" placeholder="Pega un enlace de YouTube aquí" required autocomplete="off">
                    </div>
                    <div class="add-actions">
                        <button type="submit" class="btn-secondary" id="btn-enqueue" data-mode="enqueue">Encolar</button>
                        <button type="button" class="btn-primary" id="btn-play-now">Reproducir Ahora</button>
                    </div>
                </form>
            </section>

            <!-- Queue Section -->
            <section class="queue-section">
                <div class="queue-header">
                    <h2>Cola de Reproducción</h2>
                    <div class="queue-header-actions">
                        <span class="queue-count" id="queue-size">0 canciones</span>
                        <button class="btn-text" id="btn-clear">Limpiar</button>
                    </div>
                </div>
                <div class="queue-list" id="queue-tracks-list">
                    <div class="queue-empty">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                        <p>La cola está vacía</p>
                        <span>Agrega canciones con un enlace de YouTube</span>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
